<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Love Timeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
    }
    
    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 5%;
      background: rgba(26, 26, 26, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      animation: slideDown 0.5s ease;
    }
    .logo {
      font-size: 1.5rem;
      color: #B76E79; /* rose gold accent */
      font-weight: 700;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 2rem;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #B76E79;
    }
    @keyframes slideDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }
    
    /* Hero Section */
    .hero {
      height: 100vh;
      background: linear-gradient(45deg, #B76E79, #ECD1C0);
      background-size: 200% 200%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 80px;
      animation: fadeIn 1s ease-out, gradientShift 10s infinite alternate;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .hero h1 {
      font-size: 3.5em;
      margin-bottom: 20px;
      transform: translateY(30px);
      opacity: 0;
      animation: slideUp 0.8s ease forwards;
      /* Updated pastel purple gradient for the text */
      background: linear-gradient(45deg, #B19CD9, #D8BFD8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 1.5em;
      color: rgba(255, 255, 255, 0.9);
      animation: fadeUp 1s 0.2s ease backwards;
    }
    .hero img {
      width: 200px;
      margin-top: 20px;
      border-radius: 10px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    /* Timeline Section */
    .timeline-container {
      max-width: 800px;
      margin: 120px auto 50px;
      position: relative;
      padding: 0 20px;
    }
    .timeline-line {
      position: absolute;
      left: 50%;
      width: 4px;
      height: 100%;
      background: #B76E79;
      transform: translateX(-50%);
      animation: drawLine 2s ease-out forwards;
    }
    @keyframes drawLine {
      from { height: 0; }
      to { height: 100%; }
    }
    .timeline-item {
      background: rgba(45, 45, 45, 0.7);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
      margin: 40px 0;
      width: 45%;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.4s ease;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Alternate positioning on larger screens */
    .timeline-item:nth-child(odd) {
      margin-left: 55%;
    }
    .timeline-item:nth-child(even) {
      margin-right: 55%;
    }
    .timeline-item.active {
      opacity: 1;
      transform: translateY(0);
    }
    .timeline-item:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    /* Timeline image style */
    .timeline-pic {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      background: rgba(26, 26, 26, 0.9);
      margin-top: 50px;
    }
    
    /* Responsive adjustments for Mobile */
    @media (max-width: 768px) {
      .timeline-item {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
      }
      .timeline-item:nth-child(odd),
      .timeline-item:nth-child(even) {
        margin-left: auto;
        margin-right: auto;
      }
      header {
        padding: 1rem 3%;
      }
      nav a {
        margin-left: 1rem;
      }
      .hero h1 {
        font-size: 2.5em;
      }
      .hero p {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Our Love Timeline</div>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>
  
  <!-- Hero Section -->
  <section class="hero">
    <h1>Our Journey Together</h1>
    <p>A timeline of our love story</p>
    <!-- Replace with your own hero image -->
    <img src="images/rose-gold-hero.jpg" alt="Our Special Moment">
  </section>
  
  <!-- Timeline Section -->
  <div class="timeline-container">
    <div class="timeline-line"></div>
    
    <div class="timeline-item">
      <img src="images/first.jpg" alt="First Encounter" class="timeline-pic">
      <h3>2014 - เจอกันครั้งเเรก</h3>
      <p>เอาเป็นรูปตอนเด็กเค้าไปละกันตอนนั้นยังไม่ได้ถ่าย</p>
    </div>
    
    <div class="timeline-item">
      <img src="images/middle-school-photo.jpg" alt="First Date" class="timeline-pic">
      <h3>2016 - เริ่มคบกัน</h3>
    </div>
    
    <div class="timeline-item">
      <img src="images/prom-night-photo.jpg" alt="Growing Together" class="timeline-pic">
      <h3>2018 - มอปลายที่ยังหวาน</h3>
    </div>
    
    <div class="timeline-item">
      <img src="images/university-photo.jpg" alt="Anniversary Celebration" class="timeline-pic">
      <h3>2021 - มหาลัยที่รัก </h3>
    </div>
    
 
  
  <script>
    // Animate timeline items when they scroll into view
    const timelineItems = document.querySelectorAll('.timeline-item');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, { threshold: 0.5 });
    
    timelineItems.forEach(item => observer.observe(item));
  </script>
</body>
</html>
